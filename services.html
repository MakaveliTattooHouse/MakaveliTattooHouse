<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makaveli Tattoo House - Services</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#D1232A">
    <link rel="apple-touch-icon" href="assets/images/man.png">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/services.css">
</head>
<body>
    <header class="app-header">
        <!-- New Back Navigation -->
        <nav class="top-nav">
            <button id="back-btn" class="back-btn" onclick="window.location.href='index.html'">
                &#8592; Back to Login
            </button>
        </nav>
        <h1>Services</h1>
        <p>Whatever you need</p>
        <h2>Range of Services</h2>
    </header>

    <!-- JS will dynamically inject the categories and cards here -->
    <main id="catalog-container" class="services-wrapper"></main>
<!-- New Booking Modal (Hidden by default) -->
    <div id="booking-modal" class="modal-overlay" hidden>
        <div class="modal-card">
            <h3 id="modal-service-title">Book Service</h3>
            
            <div class="form-group">
                <label for="day-select">Preferred Day:</label>
                <select id="day-select" class="custom-select">
                    <option value="Today">Today</option>
                    <option value="Tomorrow">Tomorrow</option>
                    <option value="Later this week">Later this week</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="time-select">Preferred Time:</label>
                <select id="time-select" class="custom-select">
                    <option value="Morning">Morning (10AM - 12PM)</option>
                    <option value="Afternoon">Afternoon (12PM - 4PM)</option>
                    <option value="Evening">Evening (4PM - 9PM)</option>
                </select>
            </div>
            
            <div class="modal-actions">
                <button id="cancel-booking" class="cancel-btn">Cancel</button>
                <button id="confirm-booking" class="primary-btn">Continue to WhatsApp</button>
            </div>
        </div>
    </div>
    <!-- Utility loaded first, then the renderer -->
    <script src="js/whatsapp.js"></script>
    <script src="js/services.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
</html>

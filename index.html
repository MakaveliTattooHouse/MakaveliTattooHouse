<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makaveli Tattoo House</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#D1232A">
    <link rel="apple-touch-icon" href="assets/images/man.png">
    <link rel="icon" type="image/x-icon" href="assets/images/man.png">
    <link rel="preload" as="image" href="assets/images/barber.webp">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main class="login-container">
        <div class="brand-showcase">
            <h1>Makaveli Ink House</h1>
            <p>WE ARE OPEN</p>
            <p class="hours">at 10.00 - 21.00 EAT</p>
        </div>
        
        <!-- Simplified Entry Button -->
        <button id="login-btn" class="primary-btn">Log In</button>
        <button id="install-btn" class="secondary-btn">📲 Download App</button>
    </main>

   <!-- iOS Step-by-Step Instructions Modal -->
    <div id="ios-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h3>Install on iPhone / iPad</h3>
            <p>1. Tap the <strong>Share</strong> icon (square with an arrow) in Safari's bottom menu.</p>
            <p>2. Scroll down and tap <strong>Add to Home Screen</strong>.</p>
            <p>3. Tap <strong>Add</strong> in the top-right corner.</p>
            <button id="close-modal-btn" class="primary-btn" style="margin-top: 15px; width: 100%;">Got it</button>
        </div>
    </div> 

    <script src="js/login.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('ServiceWorker registered successfully.');
                    })
                    .catch((err) => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Makaveli INK </title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-primary);
            text-align: center;
            padding: 20px;
        }
        h1 { color: var(--accent); margin-bottom: 10px; }
        p { color: var(--text-secondary); margin-bottom: 30px; }
        .refresh-btn {
            padding: 12px 30px;
            background-color: transparent;
            color: var(--accent);
            border: 2px solid var(--accent);
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .refresh-btn:active { background-color: var(--accent); color: #000; }
    </style>
</head>
<body>
    <h1>You are offline</h1>
    <p>Please check your internet connection and try again.</p>
    
    <!-- The reload mechanism -->
    <button class="refresh-btn" onclick="window.location.reload()">Try Again</button>
</body>
</html>
